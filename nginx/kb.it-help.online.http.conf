server {
    listen 80;
    server_name kb.it-help.online;
    client_max_body_size 512m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ^~ /__qr/ {
        proxy_pass http://10.233.100.107:3001/;
        proxy_set_header Host $host;
    }

    location = /static/it-help-qr.js {
        proxy_pass http://10.233.100.107:3001/ui.js;
        proxy_set_header Host $host;
    }

    location ~* ^/(auth|settings|admin|realtime)(/|$) {
        return 404;
    }

    location ~* ^/api/(auth\.|users\.|teams\.|groups\.|apiKeys\.|integrations\.|collections\.(create|update|delete)|documents\.(create|update|delete|archive|restore|move)|attachments\.(create|delete)|files\.create|comments\.(create|update|delete)|revisions\.|shares\.(create|update|revoke)) {
        return 404;
    }

    location / {
        proxy_pass http://10.233.100.107:3000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
