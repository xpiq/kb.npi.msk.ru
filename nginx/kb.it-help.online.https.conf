server {
    listen 80;
    server_name kb.it-help.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kb.it-help.online;
    client_max_body_size 512m;

    ssl_certificate /etc/letsencrypt/live/kb.it-help.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.it-help.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /__qr/code.svg {
        proxy_pass http://10.233.100.107:3001/code.svg$is_args$args;
        proxy_set_header Host $host;
    }

    location ^~ /__qr/ {
        return 404;
    }

    # Stable isolated instruction page: kb followed by nine random digits.
    # The sidecar renders only the selected document. Outline still verifies
    # that it belongs to the published IT Help tree on every request.
    location ~ "^/(kb[0-9]{9})/?$" {
        proxy_pass http://10.233.100.107:3001/resolve?code=$1;
        proxy_set_header Host $host;
    }

    # Signed attachment links may be relative in exported Outline content.
    # Keep only this read-only endpoint; the signature still controls access.
    location = /api/files.get {
        proxy_pass http://10.233.100.107:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No collection index, direct Outline document routes, search, or API.
    # Anonymous access is possible only through a registered kb######### code.
    location / {
        return 404;
    }
}
