server {
    listen 80;
    server_name wiki.npi.msk.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wiki.npi.msk.ru;

    ssl_certificate     /etc/letsencrypt/live/npi.msk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npi.msk.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location ^~ /storj/ {
        proxy_pass https://gateway.storjshare.io/;
        proxy_ssl_server_name on;
        proxy_ssl_name gateway.storjshare.io;
        proxy_set_header Host gateway.storjshare.io;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
        client_max_body_size 250m;
    }

    location / {
        proxy_pass http://10.233.100.107:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 250m;
    }
}

