# Dedicated redirect for the RustDesk download hostname.
#
# Keep this as a temporary redirect so the destination can be changed without
# browsers caching a permanent redirect. Both HTTP and HTTPS intentionally
# discard the original path and query string.
server {
    listen 80;
    server_name rust.npi.msk.ru;

    return 302 https://kb.it-help.online/kb478550122;
}

server {
    listen 443 ssl http2;
    server_name rust.npi.msk.ru;

    ssl_certificate     /etc/letsencrypt/live/npi.msk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npi.msk.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    return 302 https://kb.it-help.online/kb478550122;
}
