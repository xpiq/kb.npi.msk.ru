services:
  outline:
    image: flameshikari/outline-ru:1.9.2
    env_file: ./docker.env
    environment:
      MEDIA_S3_BUCKET_NAME: strapi
      MEDIA_PUBLIC_URL: https://media.npi.msk.ru
    extra_hosts:
      - "wiki.npi.msk.ru:10.233.100.102"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - outline-data:/var/lib/outline/data
      - ./patches/S3Storage.js:/opt/outline/build/server/storage/files/S3Storage.js:ro
      - ./patches/attachments.js:/opt/outline/build/server/routes/api/attachments/attachments.js:ro
      - ./patches/api-index.js:/opt/outline/build/server/routes/api/index.js:ro
      - ./patches/documentMover.js:/opt/outline/build/server/commands/documentMover.js:ro
      - ./patches/Model.js:/opt/outline/build/server/models/base/Model.js:ro
      - ./patches/shareDomains.js:/opt/outline/build/server/middlewares/shareDomains.js:ro
      - ./patches/index.html:/opt/outline/build/app/index.html:ro

  qr:
    build: ./qr-service
    ports:
      - "3001:3001"
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://kb.it-help.online
      PUBLIC_UPSTREAM: http://outline:3000
      EDITOR_ORIGIN: https://wiki.npi.msk.ru
      LINK_REGISTRY_PATH: /data/links.json
    volumes:
      - qr-data:/data

  postgres:
    image: postgres:15
    env_file: ./docker.env
    environment:
      POSTGRES_USER: outline
      POSTGRES_DB: outline
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  outline-data:
  qr-data:
  pg-data:
  redis-data:
